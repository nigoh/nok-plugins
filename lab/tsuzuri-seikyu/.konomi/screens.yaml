  CMP-014: { name: 0 件の表示, path: src/ui/EmptyState.tsx }
  CMP-015: { name: 失敗の表示, path: src/ui/ErrorState.tsx }
  CMP-016: { name: 短い知らせ, path: src/ui/Toast.tsx }
  CMP-017: { name: 手順の表示, path: src/ui/Stepper.tsx }
  CMP-018: { name: 見出しの帯, path: src/ui/PageHeader.tsx }
  CMP-019: { name: 絵, path: src/ui/Icon.tsx }
  CMP-020: { name: 骨格, path: src/app/AppShell.tsx }
  CMP-021: { name: 請求書の状況の札, path: src/parts/InvoiceStatusTag.tsx }
  CMP-022: { name: 入金の状況の札, path: src/parts/PaymentStatusTag.tsx }
  CMP-023: { name: ボタンの形のリンク, path: src/ui/ButtonLink.tsx }
  CMP-024: { name: 複数行の入力欄, path: src/ui/Textarea.tsx }
