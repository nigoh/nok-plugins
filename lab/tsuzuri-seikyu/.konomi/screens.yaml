# つづり請求 画面一覧と状態表（konomi のつなぎの正本）。第3回試作の土台（第1段）で決め切った。
# SCR-000（部品の見本 probe）は確かめ用で、製品の画面ではない。kind: sample で載せる（要件・状態・出入口の照合から外れ、コードにあることだけ確かめる）。
# REQ-010（配信と性能）と REQ-028（構造の守り）は製品全体の要件なので、代表して SCR-001 が受ける。

sources:
  requirements: ["docs"]
  code: ["src"]
  tests: ["src"]

targets:
  browsers: ["iOS Safari 最新2世代", "Android Chrome 最新", "Chrome", "Edge", "Safari"]
  viewports: [375, 768, 1280]
  accessibility: "JIS X 8341-3:2016 / WCAG 2.2 のレベル AA"
  performance: "LCP 2.5 秒以内（見本データ・ローカル・CPU 4 倍減速）、外部の読み込みなし"
  # 読み込む量は「全画面の合計」ではなく、最初の 1 画面を開くまでと、画面 1 枚ごとで見る（gzip。bundle-budget.mjs が測る）。
  # 1 枚に固めた HTML は試作・共有用の形なので対象外。
  budget:
    first_load_gzip_kb: 150   # 目安。実測 106（React 69＋骨格と部品 17＋共通 11＋いちばん大きい画面 9）
    screen_gzip_kb: 15        # 目安。実測は最大 8.6、中央 5.1
    added: []                 # 外の部品（ログイン・監視・入力検査など）を足したら 1 行ずつ：{ what, why, gzip_kb }

shell:
  nav: ["ホーム", "請求書", "取引先", "入金の確認", "売上レポート", "設定"]
  nav_note: "1024px 以上は左に縦、未満は上の帯の「メニュー」から窓で出す。現在地は aria-current と ai-soft の地。「はじめての設定」はメニューに無い（初回だけ）"
  # 主ボタンの置き場所は画面の種類（各画面の kind）で決まる（form.md F-10、AppShell の kind）。順は「やめる」→主（DOM も同じ）。1 画面に主は 1 つ
  primary_action: "見る画面（view）・一覧は見出しの右（768px 以上）。入力画面（form）は入力の末尾の右（768px 以上）。どちらも 768px 未満は下に固定。副は主の左（やめる→主）。窓の操作帯も同じ順、縦に積むときは主が下"
  back: "見出しの上の左に「← 行き先の呼び名」。詳細や入力画面だけに置く。押すと来た画面へ"

# 呼び名。avoid は日本語の語だけ、1 行の配列（英字は書かない：words.md L-02）。
# 制度が名前を決めている語（適格請求書発行事業者）は、その行の allow に書く。avoid の「発行」を含んでも使ってよい（terms.test.ts が allow を読む）。
terms:
  - { use: "ホーム", avoid: ["ダッシュボード", "トップ", "トップページ"] }
  - { use: "請求書", avoid: ["インボイス", "請求伝票"] }
  - { use: "取引先", avoid: ["顧客", "得意先", "クライアント", "お客様"] }
  - { use: "入金の確認", avoid: ["消込", "入金消込", "マッチング", "照合"] }
  - { use: "突き合わせ", avoid: ["突合", "消し込み"] }
  - { use: "売上レポート", avoid: ["売上分析", "月次レポート", "集計"] }
  - { use: "設定", avoid: ["環境設定", "セッティング", "オプション"] }
  - { use: "はじめての設定", avoid: ["初期設定", "セットアップ", "オンボーディング"] }
  - { use: "状況", avoid: ["ステータス", "状態"] }
  # allow＝avoid の語を含んでいても使ってよい、制度が名前を決めている語（words.md L-01）。terms.test.ts が読む。
  - { use: "送る", avoid: ["送信", "発行", "提出"], allow: ["適格請求書発行事業者"] }
  - { use: "取り消す", avoid: ["キャンセル", "無効にする"] }
  - { use: "支払期限", avoid: ["期日", "納期", "締切"] }
  - { use: "未入金", avoid: ["未収", "売掛"] }
  - { use: "明細", avoid: ["アイテム", "項目行"] }
  - { use: "履歴", avoid: ["ログ", "操作ログ"] }
  - { use: "下書き", avoid: ["一時保存", "ドラフト"], status: draft }
  - { use: "送付済み", avoid: ["送信済み", "発行済み"], status: progress }
  - { use: "入金済み", avoid: ["支払済み", "完了"], status: done }
  - { use: "期限超過", avoid: ["延滞", "滞納", "期限切れ"], status: wait }
  - { use: "取り消し済み", avoid: ["キャンセル済み", "無効"], status: calm }
  - { use: "未確認", avoid: ["未消込", "未照合"], status: wait }
  - { use: "確認済み", avoid: ["消込済み", "照合済み"], status: done }
  - { use: "差額あり", avoid: ["金額不一致", "不一致"], status: wait }

# 状態の名前は states.md E-02 の語彙に寄せた（共通の語はトレースの既知の語に入っている）。
# 画面の一部分の状態は 部位_共通の語、請求書・入金の状況は status_＋英語、流れの段は step_N、入口の違いは mode_＋英語。
# kind は画面の種類。view＝見る画面・一覧（主操作は見出しの右）、form＝入力画面（主操作は入力の末尾の右）。AppShell の kind と同じ値。
# 全画面の共通：forbidden は REQ-011、expired は「ログインも期限つきのリンクも持たない」(REQ-011) と理由を書く（E-03：理由は要件に集め、画面は ID で指す）。
screens:
  SCR-000:
    name: 部品の見本（確かめ用）
    path: ?screen=probe
    kind: sample

  SCR-001:
    name: ホーム
    path: ?screen=home
    kind: view
    covers: [REQ-001, REQ-002, REQ-003, REQ-006, REQ-007, REQ-008, REQ-010, REQ-012, REQ-027, REQ-028]
    # empty＝請求書が 1 件も無い初回（最初の請求書を作る導線）。todo_empty＝今日やることが 0 件（片付いた。E-05：結果を言い、作る導線は出さない）
    states: [default, loading, error, empty, todo_empty, many]
    none:
      forbidden: "全員が同じ権限（REQ-011）"
      expired: "ログインも期限つきのリンクも持たない（REQ-011）"
      refreshing: "並べ替え・ページ送り・再読み込みの操作が無く、数字は開いたときに 1 回取る（REQ-012）"
      not_found: "URL に id を持たない（REQ-027）"
    components: [CMP-001, CMP-003, CMP-008, CMP-009, CMP-013, CMP-019, CMP-014, CMP-015, CMP-020, CMP-021, CMP-023, CMP-029, CMP-030]
    entry: true
    to: [SCR-002, SCR-003, SCR-004, SCR-007, SCR-010]

  SCR-002:
    name: 請求書
    path: ?screen=invoices
    kind: view
    covers: [REQ-001, REQ-002, REQ-003, REQ-005, REQ-006, REQ-007, REQ-008, REQ-013, REQ-027]
    # refreshing＝並べ替え・ページ送りの待ち（前の一覧を残す）。stale＝その更新に失敗し、前の一覧を時刻つきで見せている（E-04）
    states: [default, loading, error, empty, filtered_empty, many, refreshing, stale]
    none:
      forbidden: "全員が同じ権限（REQ-011）"
      expired: "ログインも期限つきのリンクも持たない（REQ-011）"
      not_found: "一覧は URL に id を持たない（REQ-027）"
    components: [CMP-001, CMP-002, CMP-006, CMP-010, CMP-020, CMP-021, CMP-023, CMP-027, CMP-029, CMP-013, CMP-014, CMP-015, CMP-030, CMP-040]
    entry: true
    to: [SCR-001, SCR-003, SCR-004]

  SCR-003:
    name: 請求書の作成
    path: ?screen=invoice-new
    kind: form
    covers: [REQ-001, REQ-003, REQ-004, REQ-006, REQ-007, REQ-009, REQ-011, REQ-014, REQ-015, REQ-027]
    # saving＝下書きの保存中も、送る処理中も同じ名前（何をしているかは文言で分ける）。confirming＝送る前の確認の窓と、離れる前の確かめ（F-09）。
    # conflict＝同じ内容を別の人が先に更新した（REQ-011 が請求書の作成で出すと決めている）
    states: [default, loading, error, invalid, confirming, saving, save_failed, conflict, many]
    none:
      empty: "新規作成なので、明細は必ず空の 1 行目から始まる"
      forbidden: "全員が同じ権限（REQ-011）"
      expired: "ログインも期限つきのリンクも持たない（REQ-011）"
      not_found: "新規作成の URL は id を持たない（REQ-027）"
      refreshing: "並べ替え・ページ送り・再読み込みの操作が無い（REQ-014）"
      done: "成功したら請求書の詳細へ移り、この画面に終わりの表示を持たない（REQ-014）"
    components: [CMP-001, CMP-002, CMP-004, CMP-005, CMP-006, CMP-007, CMP-008, CMP-012, CMP-013, CMP-015, CMP-016, CMP-020, CMP-024, CMP-030, CMP-031, CMP-037]
    entry: true
    to: [SCR-002, SCR-004, SCR-006]

  SCR-004:
    name: 請求書の詳細
    path: ?screen=invoice-detail
    kind: view
    covers: [REQ-001, REQ-002, REQ-003, REQ-007, REQ-008, REQ-015, REQ-016, REQ-017, REQ-027]
    # default＝送付済み（支払期限の前）。status_＊＝ほかの状況の見え方（データの値）。status_void は読み取り専用で、先頭に「取り消し済みです。変更できません」を 1 度言う（C-09）
    # saving＝送る・入金の記録・取り消しの最中。confirming＝送る窓・取り消しの窓。invalid＝入金の記録の日付と金額の誤り
    states: [default, status_draft, status_overdue, status_paid, status_void, saving, save_failed, confirming, invalid, many, loading, error, not_found]
    none:
      empty: "請求書は必ず明細を 1 行以上持つ"
      forbidden: "全員が同じ権限（REQ-011）"
      expired: "ログインも期限つきのリンクも持たない（REQ-011）"
      conflict: "別の人が先に更新した表示は、設定と請求書の作成だけ（REQ-011）"
      refreshing: "並べ替え・ページ送りが無く、操作の結果はその場で差し替える（REQ-017）"
    components: [CMP-001, CMP-004, CMP-005, CMP-006, CMP-008, CMP-009, CMP-012, CMP-013, CMP-014, CMP-015, CMP-017, CMP-020, CMP-021, CMP-029, CMP-030, CMP-031]
    entry: true
    to: [SCR-002, SCR-003, SCR-005, SCR-007]

  SCR-005:
    name: 取引先
    path: ?screen=clients
    kind: view
    covers: [REQ-001, REQ-003, REQ-006, REQ-007, REQ-008, REQ-018, REQ-027]
    states: [default, loading, error, empty, filtered_empty, many, refreshing, stale]
    none:
      forbidden: "全員が同じ権限（REQ-011）"
      expired: "ログインも期限つきのリンクも持たない（REQ-011）"
      not_found: "一覧は URL に id を持たない（REQ-027）"
    components: [CMP-001, CMP-006, CMP-008, CMP-013, CMP-014, CMP-015, CMP-020, CMP-023, CMP-027, CMP-029, CMP-030, CMP-040]
    entry: true
    to: [SCR-006, SCR-004]

  SCR-006:
    name: 取引先の登録
    path: ?screen=client-form
    kind: form
    covers: [REQ-001, REQ-006, REQ-007, REQ-009, REQ-019, REQ-020, REQ-027]
    # mode_edit＝既存の取引先を編集（?id= 付き。新規と同じ欄・同じ部品）。zip_＊＝郵便番号の補完の結果（欄の一部分の状態）：zip_many＝複数の住所に当たった、zip_empty＝当たる住所が無い、zip_error＝時間切れ
    states: [default, mode_edit, loading, error, not_found, invalid, saving, save_failed, confirming, zip_many, zip_empty, zip_error]
    none:
      empty: "新規は必ず空の入力欄で始まる"
      many: "担当者は最大 5 名で、画面が崩れる量ではない"
      forbidden: "全員が同じ権限（REQ-011）"
      expired: "ログインも期限つきのリンクも持たない（REQ-011）"
      conflict: "別の人が先に更新した表示は、設定と請求書の作成だけ（REQ-011）"
      done: "保存したら取引先の一覧へ移る（REQ-019）"
    components: [CMP-001, CMP-002, CMP-004, CMP-005, CMP-006, CMP-007, CMP-012, CMP-013, CMP-015, CMP-020, CMP-030, CMP-031, CMP-032, CMP-037]
    entry: true
    to: [SCR-005, SCR-003]

  SCR-007:
    name: 入金の確認
    path: ?screen=payments
    kind: view
    covers: [REQ-001, REQ-002, REQ-003, REQ-007, REQ-008, REQ-021, REQ-022, REQ-027]
    # empty＝未確認の入金がすべて片付いた（E-05：「未確認の入金はすべて確認しました」と結果を言い、作る導線は出さない）
    # candidates_empty＝入金に合う請求書の候補が無い（手で選ぶ）。status_diff＝入金額と請求額に差額がある（その場で差額と理由を見せ 2 択。窓にしない：E-08）
    # confirming＝まとめて確認する窓（5 件以上は件数と合計額）。refreshing・stale＝確認の前に古い金額で確定させない（E-04）
    states: [default, loading, error, empty, many, candidates_empty, status_diff, confirming, partial, saving, save_failed, refreshing, stale]
    none:
      forbidden: "全員が同じ権限（REQ-011）"
      expired: "ログインも期限つきのリンクも持たない（REQ-011）"
      not_found: "一覧は URL に id を持たない（REQ-027）"
      invalid: "入力欄は請求書を探す語だけで、形式の誤りが無い（REQ-021）"
    components: [CMP-001, CMP-004, CMP-008, CMP-009, CMP-012, CMP-013, CMP-014, CMP-015, CMP-020, CMP-022, CMP-029, CMP-030, CMP-025, CMP-032, CMP-040]
    entry: true
    to: [SCR-004, SCR-001]

  SCR-008:
    name: 売上レポート
    path: ?screen=report
    kind: view
    covers: [REQ-001, REQ-003, REQ-006, REQ-007, REQ-008, REQ-023, REQ-024, REQ-027]
    # filtered_empty＝選んだ期間が 0 件（G-06：期間も条件）。partial＝一部の月が取れず「—」（G-06。失敗した月は理由と再試行）。many＝取引先が 11 社以上（上位 10＋その他：G-10）
    # saving＝書き出しの最中。refreshing・stale＝期間の切り替えの待ちと、その失敗（前の図を残す：E-04）
    states: [default, loading, error, empty, filtered_empty, many, partial, saving, refreshing, stale]
    none:
      forbidden: "全員が同じ権限（REQ-011）"
      expired: "ログインも期限つきのリンクも持たない（REQ-011）"
      not_found: "URL に id を持たない（REQ-027）"
      invalid: "入力欄が無く、期間は選択肢 3 つだけ（REQ-023）"
    components: [CMP-001, CMP-004, CMP-008, CMP-011, CMP-013, CMP-014, CMP-015, CMP-016, CMP-020, CMP-029, CMP-030, CMP-040]
    entry: true
    to: [SCR-002, SCR-005]

  SCR-009:
    name: 設定
    path: ?screen=settings
    kind: form
    covers: [REQ-001, REQ-007, REQ-009, REQ-011, REQ-025, REQ-027]
    # conflict＝同じ内容を別の人が先に更新した（REQ-011 が設定で出すと決めている）。confirming＝番号の付け方を変える前の確かめと、離れる前の確かめ
    states: [default, loading, error, invalid, saving, save_failed, confirming, conflict]
    none:
      empty: "自社の情報は必ず 1 件ある"
      many: "設定の項目数は固定"
      forbidden: "全員が同じ権限（REQ-011）"
      expired: "ログインも期限つきのリンクも持たない（REQ-011）"
      not_found: "URL に id を持たない（REQ-027）"
    components: [CMP-001, CMP-004, CMP-005, CMP-006, CMP-007, CMP-012, CMP-013, CMP-015, CMP-016, CMP-020, CMP-025, CMP-026, CMP-030, CMP-031, CMP-037, CMP-039]
    entry: true
    to: [SCR-001]

  SCR-010:
    name: はじめての設定
    path: ?screen=setup
    kind: form
    covers: [REQ-001, REQ-007, REQ-009, REQ-026, REQ-027]
    # default＝1 段目。step_2・step_3＝2・3 段目。resumed＝途中でやめた続きから開いた（先頭に「前回の続きです。2段目から始めます」）。done＝流れの終わり（ホームへ）
    states: [default, step_2, step_3, resumed, invalid, saving, save_failed, loading, error, done]
    none:
      empty: "入力する画面で、0 件の表示は無く、入力項目は 3 段階で固定（REQ-026）"
      many: "入力項目は 3 段階で固定（REQ-026）"
      forbidden: "全員が同じ権限（REQ-011）"
      expired: "ログインも期限つきのリンクも持たない（REQ-011）"
      not_found: "URL に id を持たない（REQ-027）"
      confirming: "段ごとに入力が残り、離れる前の確かめが要らない（REQ-026）"
    components: [CMP-001, CMP-004, CMP-005, CMP-006, CMP-007, CMP-013, CMP-015, CMP-017, CMP-018, CMP-020, CMP-028, CMP-030, CMP-031, CMP-039]
    entry: true
    to: [SCR-001, SCR-006]

components:
  CMP-001: { name: ボタン, path: src/ui/Button.tsx }
  CMP-002: { name: 絵のボタン, path: src/ui/IconButton.tsx }
  CMP-003: { name: 札, path: src/ui/StatusTag.tsx }
  CMP-004: { name: 知らせ, path: src/ui/Notice.tsx }
  CMP-005: { name: 入力欄の組, path: src/ui/Field.tsx }
  CMP-006: { name: 入力欄, path: src/ui/TextInput.tsx }
  CMP-007: { name: セレクト, path: src/ui/Select.tsx }
  CMP-008: { name: 金額, path: src/ui/Money.tsx }
  CMP-009: { name: 面, path: src/ui/Card.tsx }
  CMP-010: { name: タブ, path: src/ui/Tabs.tsx }
  CMP-011: { name: 選択の帯, path: src/ui/Segmented.tsx }
