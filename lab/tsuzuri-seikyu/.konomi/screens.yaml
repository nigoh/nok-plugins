  CMP-032: { name: ラジオ, path: src/ui/Radio.tsx }
  CMP-037: { name: 離れる窓, path: src/app/LeaveDialog.tsx }
  CMP-039: { name: 文字の欄, path: src/ui/TextField.tsx }
  CMP-040: { name: 古い内容・更新中の知らせ, path: src/app/StaleNotice.tsx }

# 画面に出ない共有の物（フック・関数・整形・取得の真似）は MOD-nnn。CMP は「画面に出る部品」だけ（structure.md S-02）。
# file はその物の本体、exports は画面が取り込む名前。画面の中だけの物には MOD も CMP も付けない。
# trace-check が確かめる：file が在る／exports が出ている／2 つ以上の画面（または骨格）が取り込む／テスト名に [MOD-nnn]／画面の中に同じ名前の関数が無い。
modules:
  MOD-001: { name: 数・日付の整形, file: src/lib/format.ts, exports: [formatNumber, formatYen, formatDate, formatDateShort, formatDateColumn, formatMonth, monthName, formatTime, formatAgo, daysUntil, formatZip, dateOf, ymdOf, pad, lastDayOf, addMonths, dueNote, MISSING], covers: [REQ-003] }
  MOD-002: { name: 入力の読み・そろえ, file: src/lib/normalize.ts, exports: [toHalf, toHalfDigits, wasWidened, readDate, readYen, readQuantity, settleDate, settleYen, foldForSearch, matchesWords], covers: [REQ-009] }
  MOD-003: { name: 履歴を積まない移動と URL の値, file: src/app/nav.ts, exports: [go, replace, replaceParams, useUrlParam, paramNumber, useRoute], covers: [REQ-027] }
  MOD-004: { name: 離れる時の確かめ, file: src/app/useLeaveGuard.ts, exports: [useLeaveGuard], covers: [REQ-009] }
  MOD-005: { name: 偽の保存, file: src/data/fakeSave.ts, exports: [fakeSave, outcomeOf, SAVE_WAIT_MS], covers: [REQ-011] }
  MOD-006: { name: ページで切る, file: src/lib/paginate.ts, exports: [paginate, PAGE_SIZE], covers: [REQ-013] }
  MOD-007: { name: 取得の真似, file: src/data/useFake.ts, exports: [useFake], covers: [REQ-008] }
  MOD-008: { name: 請求書から導く物, file: src/data/derive.ts, exports: [displayStatus, dueNoteOf, invoiceTotal, clientOf, describeTerms], covers: [REQ-003] }
  MOD-009: { name: 欄の検査の骨, file: src/lib/check.ts, exports: [checkEach, checkRule, formatError], covers: [REQ-009] }

# 画面固有の状態（共通の語彙に無い物）。意味は上の各画面のコメントのとおり。?state=<名前> で表示できる。
# 共通の語（default empty loading error forbidden many partial offline not_found locked confirming
# filtered_empty invalid saving save_failed done resumed conflict expired refreshing stale）は書かない（states.md E-02）。
# save_failed＝押した操作（保存・送る・取り消す・記録）が通信で失敗した。入力は残し、押した所の近くに role=alert ＋もう一度。何の操作かは文言で分ける（決定 6）。
# 第1.5段で名前を寄せた：draft→status_draft、overdue→status_overdue、paid→status_paid、diff→status_diff、
# sending・exporting→saving、edit→mode_edit、step2・step3→step_2・step_3、zip_multi→zip_many、zip_none→zip_empty、no_candidate→candidates_empty。
# 理由：E-02「土台の 18 語の寄せ先」。画面がまだ 1 枚も作られていないので、改名の影響は無い。
extra_states:
  - status_draft       # 請求書の状況：下書き（SCR-004）
  - status_overdue     # 請求書の状況：期限超過（SCR-004）
  - status_paid        # 請求書の状況：入金済み（SCR-004）
  - status_void        # 請求書の状況：取り消し済み。読み取り専用（SCR-004）
  - status_diff        # 入金の状況：差額あり（SCR-007）
  - mode_edit          # 既存の取引先の編集（SCR-006）
  - step_2             # はじめての設定の 2 段階目（請求の決まり）
  - step_3             # 3 段階目（最初の取引先）
  - zip_many           # 郵便番号が複数の住所に当たった
  - zip_empty          # 郵便番号に当たる住所が無い
  - zip_error          # 住所の補完が時間切れ
  - candidates_empty   # 入金に合う請求書の候補が無い（手で選ぶ）
  - todo_empty         # 今日やることが 0 件（片付いた）
