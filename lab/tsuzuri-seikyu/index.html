<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>つづり請求</title>
  <script>
/* 埋め込み先でも動くように：履歴の操作が断られても落とさない。?screen= のリンクは読み込み直さずに移る。 */
(function(){['pushState','replaceState'].forEach(function(k){var o=history[k];history[k]=function(a,b,u){try{var r=o.apply(history,arguments);if(window.__konomiSearch!=null&&typeof u==='string')window.__konomiSearch=u;return r}catch(e){if(typeof u==='string')window.__konomiSearch=u}}});
document.addEventListener('click',function(e){if(e.defaultPrevented||e.button||e.metaKey||e.ctrlKey)return;var a=e.target&&e.target.closest&&e.target.closest('a[href^="?"]');if(!a||a.target)return;e.preventDefault();history.pushState(null,'',a.getAttribute('href'));window.scrollTo(0,0);window.dispatchEvent(new PopStateEvent('popstate'))})})();
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
