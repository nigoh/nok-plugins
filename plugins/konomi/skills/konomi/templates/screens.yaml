# 画面一覧と状態表（konomi のつなぎの正本）
# 置き場所：リポジトリの .konomi/screens.yaml
#
# ID の決まり
#   REQ-nnn  要件。要件の文書（DevIF の決定事項など）に書かれた ID をそのまま使う
#   SCR-nnn  画面。このファイルで採番する
#   CMP-nnn  画面に出る部品。このファイルで採番する
#   MOD-nnn  画面に出ない共有の物（フック・関数・整形）。modules: に書く
#
# 実装とテストでの書き方
#   画面のいちばん外側の要素に  data-scr="SCR-001"
#   部品のいちばん外側の要素に  data-cmp="CMP-001"
#   テスト名に                  [REQ-001] と [SCR-001:empty] のように ID と状態を入れる

# 照合スクリプトが読む場所（リポジトリのルートからの相対パス）
sources:
  requirements: ["docs/requirements", ".devif/decisions"]   # REQ-nnn を探すフォルダ
  code: ["src"]                                             # data-scr / data-cmp を探すフォルダ
  tests: ["src", "tests", "e2e"]                            # テスト名の ID を探すフォルダ

# 最初に決めておく目標（後から測って合否を言うため）
targets:
  browsers: ["iOS Safari 最新2世代", "Android Chrome 最新", "Chrome", "Edge", "Safari"]
  viewports: [375, 768, 1280]
  accessibility: "JIS X 8341-3 / WCAG のレベル AA（要確認）"
  performance: "要記入（例：LCP 2.5 秒以内、初回 JS 200KB 以内）"
  budget: { first_load_gzip_kb: 150, screen_gzip_kb: 15, added: [] }   # 読む量（gzip・目安）。全画面の合計では見ない。部品を足したら added に { what, why, gzip_kb }

# 画面をまたいで共通の骨格。画面を作り始める前に決め、全画面がこれに従う。
shell:
  nav: ["注文一覧", "設定"]            # 上のメニューの項目と並び。全画面で同じにする
  # 主ボタンの位置。見る画面・一覧は見出しの右（768px 以上）。入力画面は入力の末尾（768px 以上は末尾の右、未満は下に固定）。
  # 窓と下の操作帯は「やめる」→主の順（DOM も同じ）。縦に積むときは主が下（親指側）
  primary_action: "見る画面・一覧は見出しの右。入力画面は入力の末尾（768px 未満は下に固定）。順は やめる→主"
  back: "左上に、行き先の名前つきで置く"

# 呼び名。画面・機能・状態・固有名の言い方を 1 つに決める。avoid は使わない言い方。
# avoid は日本語の語だけ、1 行の配列。英字は書かない（references/words.md）
terms:
  - { use: "注文一覧", avoid: ["オーダー一覧", "注文リスト"] }
  - { use: "確定", avoid: ["承認済み", "完了"], status: ok }
  - { use: "確認待ち", avoid: ["未確定", "保留"], status: warn }
  # 制度の語など、避ける語を含む正しい語は allow に全体を書いて許す（words.md L-02）
  - { use: "事業者", avoid: ["業者"], allow: ["適格請求書発行事業者"] }

screens:
  SCR-001:
    name: 注文一覧
    path: /orders
    covers: [REQ-001, REQ-002]        # この画面が満たす要件
    # 状態は default に加えて、この画面で起こりうるものをすべて書く。
    # 起こらない状態は none に理由つきで書く（書き忘れと区別するため）。
    states: [default, empty, loading, error, many]
    none:
      forbidden: "ログイン済みなら誰でも見られる"
    components: [CMP-001, CMP-002]
    entry: true                       # 外から直接入れる画面（入口が無くてもよい）
    to: [SCR-002]                     # この画面から行ける画面

  SCR-002:
    name: 注文詳細
    path: /orders/:id
    covers: [REQ-003]
    states: [default, loading, error, forbidden]
    none:
      empty: "注文は必ず 1 件以上の明細を持つ"
      many: "明細は最大 20 件"
    components: [CMP-002]
    to: [SCR-001]

# 画面に出る部品だけ CMP。コードに data-cmp="CMP-001" を持つ。
components:
  CMP-001: { name: 注文カード, path: src/components/OrderCard.tsx }
  CMP-002: { name: 状態バッジ, path: src/components/StatusBadge.tsx }

# 画面に出ない共有の物（フック・関数・整形・取得の真似）は MOD。2 画面（または骨格）以上が取り込む物だけ。画面の中だけの物には付けない。
# trace-check：file が在る／exports がその file から出ている／取り込む画面が 2 つ以上／テスト名に [MOD-001]／画面の中に同じ名前の関数が無い。
modules:
  MOD-001: { name: 金額の整形, file: src/lib/format.ts, exports: [formatYen], covers: [REQ-003] }

# 状態の語彙（これ以外を使うときは下に足す）
#   default    通常の表示
#   empty      データが 0 件
#   loading    読み込み中
#   error      取得や送信に失敗
#   forbidden  権限が無い・未ログイン
#   many       大量のデータ、極端に長い文字列
#   partial    一部だけ成功
#   offline    通信が無い
#   not_found  存在しない・削除済み
#   locked     一時的に止めている（試行回数の超過など）
#   confirming 取り返しのつかない操作の確認を出している
#   （references/states.md E-02 で足した語）
#   filtered_empty 絞り込みの結果が 0 件
#   invalid    入力に誤りがある
#   saving     押したボタンだけ処理中（保存・送信・書き出し）
#   done       流れの終わり
#   resumed    途中の続きから開いた
#   conflict   別の人が先に更新した
#   session_expired ログインなどの時間切れ（状況の「期限切れ」とは別。expired は使わない）
#   save_failed 保存・送る・取り消す・記録の失敗
#   refreshing 前のデータを見せて更新中
#   stale      更新できず前のデータを見せている
#
# 実装では、画面のいちばん外側の要素に data-states="default,empty,loading,error" と書き、
# URL の ?state=<状態名> でその状態を表示できるようにする（検査が全状態を撮るため）。
extra_states: []
